name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%231E1B6B&color_dots=%23EEF0F8%2C%23C7CCEA%2C%238F98D8%2C%234F46E5%2C%231E1B6B
            dist/github-snake-dark.svg?color_snake=%23A5B4FC&color_dots=%231E293B%2C%233730A3%2C%234F46E5%2C%236366F1%2C%2394A3B8

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
